name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools for signing
        run: sdkmanager "build-tools;36.0.0"

      - name: Sign release APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          
          KEYSTORE_PATH="$RUNNER_TEMP/release-key.jks"
          UNSIGNED_APK="build/app/outputs/flutter-apk/app-release.apk"
          ALIGNED_APK="build/app/outputs/flutter-apk/app-release-aligned.apk"
          SIGNED_APK="build/app/outputs/flutter-apk/app-release-signed.apk"
          
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          
          ZIPALIGN_BIN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER_BIN="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          
          "$ZIPALIGN_BIN" -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          "$APKSIGNER_BIN" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          "$ZIPALIGN_BIN" -c -v 4 "$SIGNED_APK"
          "$APKSIGNER_BIN" verify --verbose --print-certs "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: build/app/outputs/flutter-apk/app-release-signed.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release-signed.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}